global:
  security:
    allowInsecureImages: true

ingressHost: pact-broker.platform.hmcts.net
databaseType: pod

postgresql:
  auth:
    username: "hmcts"
    password: "hmcts"
    database: "hmcts"
  image:
    registry: hmctsprod.azurecr.io
    repository: imported/bitnami/postgresql
    tag: 17.5.0-debian-12-r20
  primary:
    persistence:
      enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: false

tags:
  postgresql-pod: true

image: pactfoundation/pact-broker:3.2.0-pactbroker2.124.0
applicationPort: 9292
entrypoint: exec sh /pact_broker/entrypoint.sh
enableServiceLinks: false
environment:
  PACT_BROKER_PORT: "9292"
  PACT_DO_NOT_TRACK: "true"
